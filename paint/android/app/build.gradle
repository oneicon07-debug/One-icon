plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minipaint.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.minipaint.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed (public) debug key so a newer build can be installed over an older one
    // without uninstalling - saved drawings and projects stay intact.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: only the Android framework WebView is used.
