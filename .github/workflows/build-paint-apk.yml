name: Build Mini Paint APK

# Builds the Mini Paint app (folder: paint/) and publishes it as its own release.
# Direct download link (does NOT touch the other releases in this repo):
#   https://github.com/oneicon07-debug/One-icon/releases/download/paint-latest/Mini-Paint-3D.apk

on:
  push:
    paths:
      - 'paint/**'
      - '.github/workflows/build-paint-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        working-directory: paint/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect APK
        run: cp paint/android/app/build/outputs/apk/debug/app-debug.apk Mini-Paint-3D.apk

      - name: Check the web app is inside the APK
        run: |
          unzip -l Mini-Paint-3D.apk > apk-files.txt
          grep -q "assets/www/index.html" apk-files.txt && echo "OK: assets/www/index.html" || { echo "MISSING in APK: assets/www/index.html"; exit 1; }

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paint-latest
          name: Mini Paint APK (latest)
          make_latest: false
          body: |
            Tap Mini-Paint-3D.apk below to download, then open it to install.
            Built from commit ${{ github.sha }}.
          files: Mini-Paint-3D.apk

      - name: Save error log if the build failed
        if: failure()
        run: tail -n 150 build.log > build-failure.txt || echo "no build log was produced" > build-failure.txt

      - name: Publish error log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paint-build-failed-${{ github.run_number }}
          name: Mini Paint build failed (run ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body_path: build-failure.txt
