name: Build 3D Outliner APK

# Builds the 3D Outliner app (folder: outliner/) and publishes it as its own release.
# Direct download link (does NOT touch the ARISE SYSTEM "latest" release):
#   https://github.com/oneicon07-debug/One-icon/releases/download/outliner-latest/3D-Outliner.apk

on:
  push:
    paths:
      - 'outliner/**'
      - '.github/workflows/build-outliner-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle three.js into the app (offline support)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/three-pkg" three@0.160.0 --no-audit --no-fund
          node outliner/scripts/copy-three.js \
            "$RUNNER_TEMP/three-pkg/node_modules/three" \
            outliner/android/app/src/main/assets/www/vendor/three

      - name: Build APK
        shell: bash
        working-directory: outliner/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect APK
        run: cp outliner/android/app/build/outputs/apk/debug/app-debug.apk 3D-Outliner.apk

      - name: Check the web app and three.js are inside the APK
        run: |
          unzip -l 3D-Outliner.apk > apk-files.txt
          for f in assets/www/index.html assets/www/native-shim.js assets/www/vendor/three/build/three.module.js; do
            grep -q "$f" apk-files.txt && echo "OK: $f" || { echo "MISSING in APK: $f"; exit 1; }
          done

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: outliner-latest
          name: 3D Outliner APK (latest)
          make_latest: false
          body: |
            Tap 3D-Outliner.apk below to download, then open it to install.
            Built from commit ${{ github.sha }}.
          files: 3D-Outliner.apk

      - name: Save error log if the build failed
        if: failure()
        run: tail -n 150 build.log > build-failure.txt || echo "no build log was produced" > build-failure.txt

      - name: Publish error log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: outliner-build-failed-${{ github.run_number }}
          name: 3D Outliner build failed (run ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body_path: build-failure.txt
