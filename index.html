/* ===== APK (Capacitor): native save / share so PNG + WebM export work inside the app ===== */
(function(){
 const C=window.Capacitor||{},CP=C.Plugins||{},nat=!!(C.isNativePlatform&&C.isNativePlatform()),orig=saveF;
 const b64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(r.error||new Error('read fail'));r.readAsDataURL(b)});
 saveF=async function(name,blob){
  try{
   if(nat&&CP.Filesystem&&CP.Share){
    const w=await CP.Filesystem.writeFile({path:name,data:await b64(blob),directory:'CACHE'});
    msg('Ready: '+name+' · Share sheet me "Save to device / Gallery / Files" chuno');
    await CP.Share.share({title:name,url:w.uri,dialogTitle:'Save '+name});
    return}
   if(window.claude&&claude.use){return orig(name,blob)}
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
   setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);msg('Download shuru: '+name)
  }catch(e){const t=String((e&&(e.message||e.errorMessage))||e||'');msg(/cancel/i.test(t)?'Share cancel kiya':'Save fail: '+t)}
 };
})();
