plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arise.system'
    compileSdk 34

    defaultConfig {
        applicationId "com.arise.system"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app uses only the Android framework, so it works fully offline.
